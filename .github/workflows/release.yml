name: Release

# Tag a commit to cut a release:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Requires four repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    base64 -w0 release.jks
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD
#
# And a signingConfig in app/build.gradle.kts that reads them from the
# environment — see the snippet at the bottom of this file.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          BABYM_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          BABYM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BABYM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BABYM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect artifact
        run: |
          mkdir -p dist
          APK=$(find . -path '*/build/outputs/apk/release/*.apk' | head -n 1)
          test -n "$APK" || { echo "No release APK found"; exit 1; }
          cp "$APK" "dist/babym-${GITHUB_REF_NAME}.apk"

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.apk > SHA256SUMS

      # Published in the release notes so users can confirm the signing key is
      # the same one as every previous release.
      - name: Print signing certificate fingerprint
        working-directory: dist
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --print-certs *.apk \
            | tee fingerprint.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS
          generate_release_notes: true
          body_path: dist/fingerprint.txt
          fail_on_unmatched_files: true

