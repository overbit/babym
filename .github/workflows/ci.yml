name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify project invariants
        run: python3 tools/verify_project.py

      - name: Build
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Generate initial Android Lint baseline
        run: gradle --no-daemon :app:updateLintBaseline --stacktrace

      - name: Android Lint
        run: gradle --no-daemon :app:lintDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/lint-baseline.xml
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
