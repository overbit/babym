name: Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Transitional verifier token from the lost signer. This value is not used for signing validation.
      EXPECTED_SIGNER_SHA256: ff13c20f36322208f73290a2fd5941b3172b5ee3cd0685260ec3f4944b000c77
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Require persistent signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Missing ANDROID_SIGNING_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing ANDROID_SIGNING_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing ANDROID_SIGNING_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing ANDROID_SIGNING_KEY_PASSWORD"; exit 1; }

      - name: Restore persistent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/local-baby-monitor-signing.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "CI_ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Verify signing certificate
        shell: bash
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          KEYSTORE_SIGNER_SHA256=$(
            keytool -exportcert \
              -keystore "$CI_ANDROID_KEYSTORE_PATH" \
              -alias "$ANDROID_SIGNING_KEY_ALIAS" \
              -storepass "$ANDROID_SIGNING_STORE_PASSWORD" \
              -rfc \
            | openssl x509 -noout -fingerprint -sha256 \
            | cut -d= -f2 \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]'
          )
          test -n "$KEYSTORE_SIGNER_SHA256" || { echo "::error::Could not read signing certificate"; exit 1; }
          echo "KEYSTORE_SIGNER_SHA256=$KEYSTORE_SIGNER_SHA256" >> "$GITHUB_ENV"
          echo "Persistent signer SHA-256: $KEYSTORE_SIGNER_SHA256"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify project invariants
        run: python3 tools/verify_project.py

      - name: Build persistently signed debug APK
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signing certificate
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          test -x "$APKSIGNER" || { echo "::error::apksigner was not found"; exit 1; }
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          CERTS=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)
          printf '%s\n' "$CERTS"
          APK_SIGNER_SHA256=$(
            printf '%s\n' "$CERTS" \
            | sed -n 's/^.*certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr -d '[:space:]:' \
            | tr '[:upper:]' '[:lower:]'
          )
          test -n "$APK_SIGNER_SHA256" || { echo "::error::Could not read APK signing certificate"; exit 1; }
          echo "Verified APK signer SHA-256: $APK_SIGNER_SHA256"
          if [ "$APK_SIGNER_SHA256" != "$KEYSTORE_SIGNER_SHA256" ]; then
            echo "::error::Built APK signer does not match the persistent keystore certificate."
            exit 1
          fi

      - name: Name APK from app version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          APK_NAME="LocalBabyMonitor-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalBabyMonitor-${{ github.sha }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        shell: bash
        run: |
          if [ -n "${CI_ANDROID_KEYSTORE_PATH:-}" ]; then
            rm -f "$CI_ANDROID_KEYSTORE_PATH"
          fi
